name: self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/certserver/go.mod
          cache: false
      - name: Start the test TLS server
        shell: bash
        run: test/start-certserver.sh

      - id: valid
        name: A valid certificate passes
        uses: ./
        with:
          targets: |
            # comments and blank lines are skipped

            127.0.0.1:8441
          args: |
            --ca-file
            ${{ runner.temp }}/ca.pem

      - id: expiring
        name: An expiring certificate fails the step
        continue-on-error: true
        uses: ./
        with:
          targets: 127.0.0.1:8442
          args: |
            --ca-file
            ${{ runner.temp }}/ca.pem

      - id: warn-days
        name: args reach expirely
        uses: ./
        with:
          targets: 127.0.0.1:8442
          args: |
            --warn-days
            5
            --ca-file
            ${{ runner.temp }}/ca.pem

      - id: install
        name: Without targets or args the action only installs
        uses: ./

      - name: Check every case
        shell: bash
        env:
          VALID: ${{ steps.valid.outcome }}
          EXPIRING: ${{ steps.expiring.outcome }}
          WARN_DAYS: ${{ steps.warn-days.outcome }}
          INSTALL: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          failures=0
          expect() {
            if [[ "$2" == "$3" ]]; then echo "ok   $1"; else echo "FAIL $1: got \"$2\", want \"$3\""; failures=$((failures + 1)); fi
          }
          expect "a valid certificate passes" "$VALID" success
          expect "an expiring certificate fails" "$EXPIRING" failure
          expect "args reach expirely" "$WARN_DAYS" success
          expect "install only" "$INSTALL" success
          expect "expirely is on PATH" "$(expirely --version)" "{\"version\":\"v$(scripts/check-default-version.sh)\"}"
          exit "$failures"
