name: expirely
description: Fail CI before a TLS certificate expires. Installs a checksum-verified expirely and checks your endpoints, AWS or Google Cloud.
author: bycavii
branding:
  icon: clock
  color: orange

inputs:
  targets:
    description: Endpoints to check, one per line, as host, host:port or https:// URL. Blank lines and lines starting with # are skipped.
    required: false
    default: ''
  args:
    description: Extra expirely arguments, one per line, placed before the targets, such as --warn-days and 21, or aws to read AWS. With neither targets nor args, the action only installs expirely.
    required: false
    default: ''
  version:
    description: expirely version to install, such as 0.6.0. The default is pinned, and its checksums ship with this action.
    required: false
    default: '0.6.0'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPIRELY_TARGETS: ${{ inputs.targets }}
        EXPIRELY_ARGS: ${{ inputs.args }}
        EXPIRELY_VERSION: ${{ inputs.version }}
      run: '"${GITHUB_ACTION_PATH}/action.sh"'
